<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orbit</title>

    <link rel="stylesheet" href="style.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="titlebar"></div>
    <div class="sidebar">
        <div class="sidebar-icon-name">
            <img src="../../../../assets/icons/icon-transparent.png" alt="Orbit Logo">
            <h3>Orbit</h3>
            <button class="new-chatbutton" id="newchat">
                + New Chat
            </button>
            <hr>
            <div class="chat-history">
            </div>
            <div class="profilebar">
                <div class="photo-icon" id="profile-icon">
                    <span id="profile-icon-text">NS</span>
                </div>
                <h4>Name Surname</h4>
                <h5>Plan</h5>
            </div>
        </div>
    </div>
    <div class="homebar">
        <div class="chatbox" id="chat-box">
                    <input type="text" id="promptinput" placeholder="Ask Orbit Anything....">
        <button type="button" id="send-button">
            <i class="bi bi-mic-fill" id="send-icon"></i>
        </button>
        </div>


    </div>

    <script src="./script.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
